name: Build production image

# Builds Dockerfile.prod and pushes to GHCR.
# Production servers pull this image — they do not run docker build.
#
# Tags:
#   - push to main  → :main, :latest, :sha-<short>
#   - git tag v1.2.3 → :v1.2.3

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-prod-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/senan-group-inc/snapdesk-staff-portal
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://snapdesk.pywe.org/api/v1
            NEXT_PUBLIC_MAIN_DOMAIN=snapdesk.pywe.org
            NEXT_PUBLIC_GLPI_URL=https://glpi.senangroupafrica.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
